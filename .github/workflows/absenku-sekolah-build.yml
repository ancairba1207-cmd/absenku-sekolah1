name: ABSENKU SEKOLAH Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Cek konfigurasi ABSENKU
        run: |
          echo "Cek proyek..."
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/python/absenku_app.py
          echo "Python Chaquopy:"
          grep 'version = "3.12"' app/build.gradle

      - name: Build APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Cek APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan!"
            find app/build -type f 2>/dev/null || true
            exit 1
          fi
          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABSENKU-SEKOLAH-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
