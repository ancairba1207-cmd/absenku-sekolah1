name: ABSENKU SEKOLAH Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Ambil kode ABSENKU
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Ekstrak proyek APK
        run: |
          rm -rf android_project
          mkdir -p android_project
          unzip -q ABSENKU_SEKOLAH_APK_PROJECT_FINAL.zip -d android_project
          echo "Isi proyek:"
          find android_project -maxdepth 3 -type f | sort

      - name: Build APK
        working-directory: android_project
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Cek file APK
        run: |
          APK="android_project/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan:"
            find android_project/app/build -type f 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABSENKU-SEKOLAH-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
