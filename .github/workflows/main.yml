name: ABSENKU SEKOLAH Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Extract ABSENKU project
        run: |
          mkdir android_project
          unzip -q ABSENKU_SEKOLAH_APK_PROJECT_FINAL.zip -d android_project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android_project
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Check APK
        run: |
          ls -lh android_project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABSENKU-SEKOLAH-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
