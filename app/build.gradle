plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.absenku.sekolah'
    compileSdk 35

    defaultConfig {
        applicationId 'com.absenku.sekolah'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '1.3'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        pip {
            install("flask")
            install("qrcode[pil]")
            install("openpyxl")
            install("pillow")
            install("requests")
        }
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
